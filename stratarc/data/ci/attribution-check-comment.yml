# Attribution check for issue and review comments. Source:
# data/ci/attribution-check-comment.yml in the stratarc package, rendered into
# each managed project by stratarc; edit the source.
#
# A separate workflow with its own check name, so a comment hit fails only
# this run and never reports, skips or satisfies the pull request check in
# attribution-check.yml.
name: attribution-check-comment

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  comment:
    name: attribution-check-comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: scan the comment
        run: python3 .github/attribution-check/attribution-check.py
