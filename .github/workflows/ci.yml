# Tests, shell lint, the token-shaped value scan and the frontmatter key check
# for every push and pull request.
name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install test dependencies
        run: python -m pip install -e '.[test]'
      - name: no machine paths in tests
        run: "! grep -rIn '/Users/' tests"
      - name: pytest
        run: python -m pytest -q
      - name: validate the example and the template
        run: |
          python -m stratarc validate --root examples/notes-cli/source --strict --checks generic
          python -m stratarc validate --root stratarc/data/templates/source-root --strict --checks generic

  lint-and-scan:
    name: lint-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          git ls-files -z '*.sh' 'stratarc/data/git-hooks/*' | xargs -0 shellcheck -x -P SCRIPTDIR -S warning
      - name: token-shaped value scan
        run: bash scripts/ci/token-scan.sh
      - name: frontmatter key check
        run: python3 scripts/ci/frontmatter-keys.py
