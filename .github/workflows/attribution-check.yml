# Attribution check for pull requests and pushes: scans the pull request
# title, body and commit messages, or each pushed commit message, with the
# same detector the local guard and commit-msg backstop use.
#
# No comment event may ever run this workflow. A job skipped by an if: still
# reports its check, and a skipped check satisfies a required one. An old
# comment cannot be edited away, so it never blocks.
name: attribution-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  pull-request:
    name: attribution-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: scan what the event published
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/commits" --paginate --jq '.[] | {sha: .sha, message: .commit.message}' > "$RUNNER_TEMP/commits.jsonl"
            python3 scripts/ci/attribution-check.py --commits "$RUNNER_TEMP/commits.jsonl"
          else
            python3 scripts/ci/attribution-check.py
          fi
