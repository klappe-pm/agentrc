# Builds the documentation site and fails when a generated reference page
# differs from the code. It publishes nothing and uses no secrets.
name: docs

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: generated pages match the code
        run: python3 scripts/docs/build_site.py --check
      - name: build the site
        run: python3 scripts/docs/build_site.py --out "$RUNNER_TEMP/site"
