# agentrc configuration for this source root.
# `agentrc sync` reads this file to decide which runtimes to build and where to deploy them.

# The GitHub owner (a user or organization login) whose repositories count as managed projects.
# Checkouts under projects_root whose origin belongs to this owner receive the shared baseline.
# Leave it empty to treat no repository as managed by owner.
owner = ""

# The directory that holds your project checkouts. `~` expands to your home directory.
projects_root = "~/projects"

# One table per supported runtime.
#   enabled: whether `agentrc sync` builds and deploys this runtime.
#   target:  the directory the runtime reads its configuration from; `~` expands to your home directory.

[runtimes.claude]
enabled = true
target = "~/.claude"

[runtimes.codex]
enabled = false
target = "~/.codex"

[runtimes.gemini]
enabled = false
target = "~/.gemini"

[runtimes.cursor]
enabled = false
target = "~/.cursor"

[runtimes.opencode]
enabled = false
target = "~/.config/opencode"
