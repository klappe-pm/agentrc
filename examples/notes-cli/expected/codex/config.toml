
approval_policy = "on-request"
approvals_reviewer = "auto_review"
web_search = "live"
default_permissions = "stratarc"
[projects."<home>/projects/active/notes-cli"]
trust_level = "trusted"

[features]
memories = false

[memories]
use_memories = false
generate_memories = false

[desktop]
external-agent-import-sync-enabled = false

[history]
persistence = "save-all"
# BEGIN stratarc permissions, generated from permissions.json
[permissions.stratarc]
extends = ":workspace"

[permissions.stratarc.workspace_roots]
"~/projects" = true
"~/.claude" = true
"~/.codex" = true
"~/.gemini" = true
"~/.cursor" = true
"~/.config/opencode" = true

[permissions.stratarc.filesystem.":workspace_roots"]
"**/.env" = "deny"

[permissions.stratarc.network]
enabled = false

# END stratarc permissions
