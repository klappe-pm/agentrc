# stratarc configuration for the notes-cli example source root.
# `stratarc sync` reads this file to decide which runtimes to build and where to deploy them.

# The GitHub owner whose repositories count as managed projects.
# A checkout under projects_root whose origin belongs to this owner receives the shared baseline.
owner = "example-owner"

# The directory that holds your project checkouts. `~` expands to your home directory.
projects_root = "~/projects"

# One table per supported runtime. This developer uses all five.
#   enabled: whether `stratarc sync` builds and deploys this runtime.
#   target:  the directory the runtime reads its configuration from.

[runtimes.claude]
enabled = true
target = "~/.claude"

[runtimes.codex]
enabled = true
target = "~/.codex"

[runtimes.gemini]
enabled = true
target = "~/.gemini"

[runtimes.cursor]
enabled = true
target = "~/.cursor"

[runtimes.opencode]
enabled = true
target = "~/.config/opencode"
